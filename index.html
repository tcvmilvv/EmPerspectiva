<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vamos olhar para isso com calma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <header class="topbar">
    <button id="btnBack" class="link-btn" hidden>&larr; voltar</button>
    <span class="topbar-spacer"></span>
    <button id="btnRestart" class="link-btn" hidden>reiniciar</button>
  </header>

  <main class="stage">

    <!-- HOME -->
    <section class="screen" id="screen-home" data-active="true">
      <p class="eyebrow">um espaço para pensar</p>
      <h1 class="handwritten">Vamos olhar para isso<br>com calma.</h1>
      <div class="body-text" id="homeText"></div>
      <button class="btn-primary" id="btnStart">Começar</button>
    </section>

    <!-- DYNAMIC NODE (choice / text / terminal — built entirely by script.js) -->
    <section class="screen" id="screen-node"></section>

  </main>

  <footer class="foot">
    <p>Isso não é um diário. Nada aqui é salvo — cada reflexão vale só para o momento.</p>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
